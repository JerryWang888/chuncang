    <!-- 库存 -->
    <section class="view" id="view-stock">
      <div class="kpis" id="kpis"></div>
      <div class="filters" id="stockFilters"></div>
      <div class="stock-list" id="stockList"></div>
      <div class="table-wrap" id="tableWrap">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap">
          <span id="tableCount" style="font-size:11px;color:var(--dim)"></span>
          <div class="mode" id="viewMode">
            <button class="on" data-mode="table" data-i18n="tableView">表格</button>
            <button data-mode="cards" data-i18n="cardView">卡片</button>
          </div>
          <div class="spacer"></div>
          <button class="btn-ghost" id="compareBtn" style="font-size:11px">对比选中 <span id="cmpCount">0</span>/6</button>
        </div>
        <table>
          <thead><tr>
            <th style="width:34px"><input type="checkbox" class="chk" id="chkAll"></th>
            <th data-sort="name" data-i18n="colName">酒品</th>
            <th data-sort="wh" data-i18n="colWh">仓位</th>
            <th data-sort="qty" class="r" data-i18n="colQty">数量</th>
            <th data-sort="cost" class="r" data-i18n="colCost">成本</th>
            <th data-sort="ref" class="r" data-i18n="colRef">当前批价</th>
            <th data-sort="pnl" class="r" data-i18n="colPnl">浮盈浮亏</th>
            <th data-sort="status" data-i18n="colStatus">状态</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 预警 -->
    <section class="view" id="view-alert" hidden>
      <div class="page-head">
        <h1 data-i18n="alertPage">风险预警</h1>
        <span id="alertSub"></span>
      </div>
      <div class="seg" id="alertSeg">
        <button class="on" data-astate="todo" data-i18n="todo">待处理</button>
        <button data-astate="done" data-i18n="history">历史</button>
      </div>
      <div id="alertBody"></div>
    </section>

    <!-- 行情 -->
    <section class="view" id="view-market" hidden>
      <div class="page-head">
        <h1 data-i18n="marketPage">行情参考</h1>
        <span data-i18n="marketSub">仅作辅助判断，不构成投资建议</span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="mktSearch" type="search" data-i18n-ph="searchPh" placeholder="搜索酒品 / 品牌">
      </div>
      <div class="filters" id="mktFilters"></div>
      <div class="mkt-list" id="mktList"></div>
    </section>
  </main>

  <!-- 右侧详情面板 -->
  <aside class="panel">
    <div class="panel-in" id="panelBody"></div>
  </aside>
</div>

<!-- 底部导航 -->
<nav class="tabbar">
  <button class="tab on" data-view="stock">
    <svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg>
    <span data-i18n="tabStock">库存</span>
  </button>
  <button class="tab" data-view="alert">
    <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 016 6v4l2 3H4l2-3V9a6 6 0 016-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
    <span data-i18n="tabAlert">预警</span>
    <span class="bdg" id="tabBadge">0</span>
  </button>
  <button class="tab" data-view="market">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    <span data-i18n="tabMarket">行情</span>
  </button>
</nav>

<button class="fab" id="fabRecord">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  <span data-i18n="record">记一笔</span>
</button>

<div class="backdrop" id="backdrop"></div>

<!-- 记一笔 -->
<div class="sheet" id="recordSheet">
  <div class="grab"></div>
  <div class="sheet-h">
    <h3 data-i18n="recordTitle">记一笔</h3>
    <span id="recordStockHint" style="font-size:10px;color:var(--dim)"></span>
    <button class="x" data-close="recordSheet">✕</button>
  </div>
  <div class="form">
    <div class="seg-line" id="recType">
      <button class="on" data-rt="in" data-i18n="rIn">入库</button>
      <button data-rt="out" data-i18n="rOut">出库</button>
      <button data-rt="move" data-i18n="rMove">调拨</button>
      <button data-rt="check" data-i18n="rCheck">盘点</button>
    </div>
    <div class="fld">
      <label data-i18n="fSpirit">酒品</label>
      <select id="recSpirit"></select>
    </div>
    <div id="recWhWrap" class="qty-row">
      <div class="fld">
        <label id="whLabel" data-i18n="fWh">仓位</label>
        <select id="recWh"></select>
      </div>
      <div class="fld" id="recToWrap" hidden>
        <label data-i18n="fWhTo">调至</label>
        <select id="recTo"></select>
      </div>
    </div>
    <div class="qty-row">
      <div class="fld">
        <label data-i18n="fCase">件数</label>
        <div class="u"><input id="recCase" type="number" min="0" value="1"><span data-i18n="case">件</span></div>
      </div>
      <div class="fld">
        <label data-i18n="fBottle">瓶数</label>
        <div class="u"><input id="recBottle" type="number" min="0" value="0"><span data-i18n="bottle">瓶</span></div>
      </div>
    </div>
    <div class="fld" id="recPriceWrap">
      <label id="priceLabel" data-i18n="fCost">单瓶成本（元）</label>
      <input id="recPrice" type="number" min="0" step="0.01">
    </div>
    <div class="fld" id="recNoteWrap">
      <label data-i18n="fNote">备注（可选）</label>
      <input id="recNote" type="text" data-i18n-ph="notePh" placeholder="如：到货 / 客户自提">
    </div>
    <div class="sum-line" id="recSum"></div>
    <button class="btn-gold" id="recSubmit" style="padding:13px;font-size:14px" data-i18n="confirmIn">确认入库</button>
    <div class="hint" data-i18n="recordHint">提交后 60 秒内可撤销；超时更正将生成红冲流水，原始记录保留。</div>
  </div>
</div>

<!-- 详情 -->
<div class="sheet" id="detailSheet">
  <div class="grab"></div>
  <div class="sheet-h">
    <h3 data-i18n="detail">库存详情</h3>
    <button class="x" data-close="detailSheet">✕</button>
  </div>
  <div id="detailBody"></div>
</div>

<!-- P0 弹窗 -->
<div class="modal" id="alertModal">
  <div class="modal-card">
    <div class="m-top">
      <span class="m-badge" id="p0Badge">P0 · 强提醒</span>
      <span class="m-type" id="p0Type"></span>
      <button class="m-close" data-close-modal>✕</button>
    </div>
    <div class="m-title" id="p0Title"></div>
    <div class="m-reason" id="p0Reason"></div>
    <div class="m-grid" id="p0Grid"></div>
    <div class="m-note" data-i18n="disclaimer">信息仅供参考，不构成购买或投资建议。政策类预警不受免打扰限制。</div>
    <div class="m-act">
      <button class="primary" data-close-modal data-i18n="gotIt">我已了解</button>
      <button class="ghost" id="p0Detail" data-i18n="viewDetail">查看详情</button>
    </div>
  </div>
</div>

<!-- P1 卡片 -->
<div class="p1pop" id="p1pop">
  <div class="hd"><span class="badge p1">P1</span><span id="p1Type"></span><span style="margin-left:auto" id="p1Time"></span></div>
  <div class="tt" id="p1Title"></div>
  <div class="rr" id="p1Reason"></div>
  <div class="ac">
    <button id="p1View" data-i18n="viewDetail">查看详情</button>
    <button class="s" id="p1Later" data-i18n="later">稍后</button>
    <button class="s" id="p1Mute" data-i18n="mute">不再提醒</button>
  </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
